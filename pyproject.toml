[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caliper-cad"
version = "2.0.0"
description = "卡尺 Caliper：用平常话做 CAD 零件，每一步都由程序实测（基于 SimpleCADAPI，AICG Project 3）"
requires-python = ">=3.10,<3.14"
dependencies = [
    "simplecadapi[editor,verify]==2.2.7",
    "openai>=1.40",
    "pyyaml>=6",
    "anthropic>=2.8",
    "keyring>=25.7",
    "pywebview>=6.2",
]

[project.scripts]
caliper = "cad_agent.app:main"

[project.gui-scripts]
caliper-app = "cad_agent.app:gui_main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["cad_agent*"]
exclude = ["tests*", "benchmarks*", "scripts*"]

[tool.setuptools.package-data]
cad_agent = ["agent/prompts/*.md", "agent/prompts/*.json", "case_data/*/case.yaml", "providers.toml",
             "desk/static/**/*", "desk/demo_data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # 直接运行 pytest 时也能 import benchmarks
markers = [
    "sca: 需要 SCA 运行的较慢测试",
]
