    - {id: size-y, type: bbox, axis: y, expected: 60, tol: 0.5}
    - {id: size-z, type: bbox, axis: z, expected: 30, tol: 0.5}
    - {id: fin-tops, type: count, kind: faces, where: [["geom.type", "==", "PLANE"], ["geom.normal.z", ">=", 0.99], ["geom.center.z", ">=", 29.9]], expected: 13}
    - {id: in-1, type: point_inside, point: [0, 0, 3]}
    - {id: in-2, type: point_inside, point: [0, 0, 20]}
    - {id: in-3, type: point_inside, point: [9, 0, 20]}
