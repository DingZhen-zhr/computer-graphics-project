title: 四角孔安装板
tags:
- 安装板
- 拉伸
- 线性阵列
- 孔
request: 做一块矩形安装板，四个角上各打一个孔，中间开一个大圆孔
brief:
  part:
    name: 安装板
    purpose: 把小设备固定到机架上
  params:
  - name: plate_l
    value: 100
    unit: mm
    source: user
    note: 板长（x 方向）
  - name: plate_w
    value: 60
    unit: mm
    source: user
    note: 板宽（y 方向）
  - name: plate_t
    value: 5
    unit: mm
    source: user
    note: 板厚
  - name: hole_d
    value: 6
    unit: mm
    source: user
    note: 角孔直径
  - name: hole_inset
    value: 10
    unit: mm
    source: user
    note: 角孔孔心离相邻两条边的距离
  - name: center_d
    value: 30
    unit: mm
    source: user
    note: 中间大孔直径
  features:
  - 板
  - 角孔，四个角上
  - 中心孔
  relations:
  - 角孔在板的四个角上，孔心离相邻两条边各 hole_inset
  - 中心孔在板的正中，贯通板厚
  open_questions: []
  confirmed: true
plan:
- title: 板
  done_when: 有一块 plate_l × plate_w × plate_t 的矩形板
- title: 角孔
  done_when: 四个角上各有一个贯通的孔
- title: 中心孔
  done_when: 板中间有一个贯通的大圆孔
features:
- slug: plate
  role: build
  stage: s1
  code: |
    _profile = scad.make_rectangle_rface(width=plate_l, height=plate_w, center=(0, 0, 0), normal=(0, 0, 1))
    plate = scad.extrude_rsolid(profile=_profile, direction=(0, 0, 1), distance=plate_t)
- slug: corner-holes
  role: pattern
  stage: s2
  code: |
    _hole = scad.make_cylinder_rsolid(radius=hole_d / 2, height=plate_t + 2, bottom_face_center=(-plate_l / 2 + hole_inset, -plate_w / 2 + hole_inset, -1))
    _row = scad.linear_pattern_rsolidlist(shape=_hole, direction=(1, 0, 0), count=2, spacing=plate_l - 2 * hole_inset)
    _grid = [_q for _h in _row for _q in scad.linear_pattern_rsolidlist(shape=_h, direction=(0, 1, 0), count=2, spacing=plate_w - 2 * hole_inset)]
    corner_holes = scad.cut_rsolid(plate, _grid, skip_non_intersecting=False)
- slug: center-hole
  role: subtract
  stage: s3
  code: |
    _c = scad.make_cylinder_rsolid(radius=center_d / 2, height=plate_t + 2, bottom_face_center=(0, 0, -1))
    center_hole = scad.cut_rsolid(corner_holes, _c, skip_non_intersecting=False)
checks:
- id: size-x
  type: bbox
  axis: x
  expected: plate_l
  stage: s1
- id: size-y
  type: bbox
  axis: y
  expected: plate_w
  stage: s1
- id: size-z
  type: bbox
  axis: z
  expected: plate_t
  stage: s1
- id: corner-holes
  type: count
  kind: faces
  expected: 4
  stage: s2
  where:
  - - geom.type
    - ==
    - CYLINDER
  - - geom.area
    - '>='
    - pi * hole_d * plate_t * 0.95
  - - geom.area
    - <=
    - pi * hole_d * plate_t * 1.05
- id: corner-hole-center
  type: point_outside
  point:
  - -plate_l / 2 + hole_inset
  - -plate_w / 2 + hole_inset
  - plate_t / 2
  stage: s2
- id: corner-hole-edge
  type: point_inside
  point:
  - -plate_l / 2 + hole_inset + hole_d / 2 + 0.3
  - -plate_w / 2 + hole_inset
  - plate_t / 2
  stage: s2
- id: center-hole
  type: count
  kind: faces
  expected: 1
  stage: s3
  where:
  - - geom.type
    - ==
    - CYLINDER
  - - geom.area
    - '>='
    - pi * center_d * plate_t * 0.95
  - - geom.area
    - <=
    - pi * center_d * plate_t * 1.05
- id: center-empty
  type: point_outside
  point:
  - 0
  - 0
  - plate_t / 2
  stage: s3
- id: center-edge
  type: point_inside
  point:
  - center_d / 2 + 0.3
  - 0
  - plate_t / 2
  stage: s3
