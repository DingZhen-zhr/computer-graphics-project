<!doctype html>
<html lang="zh-CN" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Datum 基准</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/chat.css">
  <link rel="stylesheet" href="/static/css/bench.css">
  <link rel="stylesheet" href="/static/css/pages.css">
  <script type="importmap">{"imports": {"three": "/static/vendor/three/three.module.js"}}</script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" id="brand-mark"></span><span class="brand-name">Datum</span><span class="brand-en">基准</span></div>
    <div class="top-title" id="top-title"></div>
    <div class="top-actions">
      <button class="btn btn-text" type="button" id="theme-btn"></button>
      <button class="btn btn-text" type="button" id="settings-btn">设置</button>
    </div>
  </header>
  <div class="conn hidden" id="conn" role="status" aria-live="polite">连接断开，正在重试</div>

  <main class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="会话"></aside>
    <section class="chat" id="chat" aria-label="对话"></section>
    <section class="bench" id="bench" aria-label="工作台"></section>
  </main>
  <section class="page hidden" id="page"></section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog class="dialog" id="dialog" aria-label="确认"></dialog>

  <template id="icons">
    <svg data-icon="plus" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.3"/></svg>
    <svg data-icon="pencil" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 13l1-3.5 7-7 2.5 2.5-7 7L3 13z" stroke="currentColor" stroke-width="1.2"/></svg>
    <svg data-icon="cross" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.3"/></svg>
    <svg data-icon="stop" width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 4h8v8H4z" fill="currentColor"/></svg>
    <svg data-icon="brand" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 5.5h19M5 5.5v13M5 18.5l2.5-5V5.5M14 5.5v6h4v-6M9 5.5V9M11 5.5V8" stroke="currentColor" stroke-width="1.3"/></svg>
  </template>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
