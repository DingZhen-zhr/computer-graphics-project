<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CAD 建模助手</title>
  <link rel="stylesheet" href="/static/style.css">
  <!-- three.js 在本地，演示时不依赖外网 -->
  <script type="importmap">
    { "imports": { "three": "/static/vendor/three/three.module.js" } }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>CAD 建模助手</span></div>
    <div class="topbar-right">
      <span class="tag" id="model-name">模型</span>
      <span class="tag usage" id="usage">本次会话 尚无用量</span>
      <button class="link-btn" id="reset-btn" type="button">新会话</button>
    </div>
  </header>
  <div class="banner hidden" id="banner" role="status" aria-live="polite">连接断开，正在重试</div>

  <main class="layout">
    <section class="chat" aria-label="对话">
      <div class="chat-box">
        <h2 class="chat-title">对话</h2>
        <div class="messages" id="messages" role="log" aria-live="polite"></div>
        <div class="progress hidden" id="progress" aria-live="polite"></div>
        <form class="composer" id="composer">
          <label class="sr-only" for="input">给建模助手的消息</label>
          <textarea id="input" rows="1" placeholder="说出你想做的零件…" title="Enter 发送，Shift+Enter 换行"></textarea>
          <button class="btn primary" id="send" type="submit">发送</button>
        </form>
      </div>
    </section>

    <section class="panels" aria-label="模型、检查、需求单和版本">
      <article class="card card-model" id="card-model">
        <div class="card-head">
          <h2 class="card-title">01 模型</h2>
          <div class="toolbar" role="toolbar" aria-label="模型视图工具">
            <button type="button" id="btn-reset-view">重置视角</button>
            <button type="button" id="btn-wire" aria-pressed="false">线框</button>
            <button type="button" id="btn-image" aria-pressed="false">切换到截图</button>
          </div>
        </div>
        <div class="viewer-box" id="viewer-box">
          <div class="viewer-empty" id="viewer-empty">交付后在这里显示模型</div>
          <img id="viewer-img" class="hidden" alt="模型截图">
          <div class="viewer-note hidden" id="viewer-note"></div>
        </div>
      </article>

      <article class="card card-checks" id="card-checks">
        <h2 class="card-title">02 检查</h2>
        <div id="checks-body"><p class="empty">还没有运行检查</p></div>
      </article>

      <article class="card card-brief" id="card-brief">
        <h2 class="card-title">03 需求单</h2>
        <div id="brief-body"><p class="empty">还没有需求单</p></div>
      </article>

      <article class="card card-versions" id="card-versions">
        <h2 class="card-title">04 版本</h2>
        <div id="versions-body"><p class="empty">交付后在这里列出版本</p></div>
      </article>
    </section>
  </main>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
