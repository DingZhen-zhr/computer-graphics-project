<!doctype html>
<html lang="zh-CN" data-mode="static">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CAD 建模助手</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23E5322D'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="static/style.css">
  <!-- three.js 放在项目里，演示时不依赖外网 -->
  <script type="importmap">
    { "imports": { "three": "./static/vendor/three/three.module.js" } }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">CAD 建模助手</span>
      <span class="brand-sub">自然语言 → 参数化模型</span>
    </div>
    <ol class="rail" id="rail" aria-label="流程">
      <li data-stage="clarify"><span class="step-no">01</span><span class="step-label">澄清</span></li>
      <li data-stage="confirm"><span class="step-no">02</span><span class="step-label">确认</span></li>
      <li data-stage="modeling"><span class="step-no">03</span><span class="step-label">建模</span></li>
      <li data-stage="checking"><span class="step-no">04</span><span class="step-label">检查</span></li>
      <li data-stage="delivered"><span class="step-no">05</span><span class="step-label">交付</span></li>
    </ol>
    <div class="top-right">
      <span class="pill replay hidden" id="replay-pill"><span class="dot"></span>回放 · 只读</span>
      <a class="btn-live hidden" id="live-link" href="#" target="_blank" rel="noopener">开始实时体验 →</a>
      <span class="pill" id="usage-pill" title="本次会话大模型的累计用量">尚无用量</span>
      <span class="pill" id="model-pill">模型</span>
      <button class="btn-ghost" id="reset-btn" type="button">新会话</button>
    </div>
  </header>

  <div class="app">
    <section class="chat" aria-label="对话">
      <div class="notice hidden" id="notice" role="status" aria-live="polite"></div>
      <div class="messages" id="messages" role="log" aria-live="polite"></div>
      <form class="composer" id="composer" autocomplete="off">
        <div class="composer-box">
          <label class="sr-only" for="input">消息</label>
          <textarea id="input" rows="1" placeholder="描述你想做的零件……"></textarea>
          <button class="send" id="send" type="submit" aria-label="发送" disabled>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="composer-hint" id="composer-hint">Enter 发送 · Shift + Enter 换行</div>
      </form>
    </section>

    <main class="workspace" id="workspace">
      <section class="section" aria-labelledby="t-model">
        <div class="section-head"><span class="section-no">01</span><h2 class="section-title" id="t-model">模型</h2><span class="section-meta" id="model-meta"></span></div>
        <div class="part-head">
          <div>
            <h1 class="part-name placeholder" id="part-name">还没有零件</h1>
            <p class="part-purpose" id="part-purpose">在左边用一句话描述你想做的东西</p>
          </div>
          <div class="version-tag hidden" id="version-tag"><span class="square" aria-hidden="true"></span><span id="version-tag-text"></span></div>
        </div>
        <div class="viewport" id="viewport">
          <div class="viewport-empty" id="viewport-empty"><div><div class="big">交付后，模型会显示在这里</div><div>可以拖动旋转、滚轮缩放</div></div></div>
          <div class="vp-note hidden" id="vp-note"></div>
          <div class="vp-tools">
            <div class="seg" role="group" aria-label="显示方式">
              <button type="button" id="mode-3d" aria-pressed="true">3D</button>
              <button type="button" id="mode-shot" aria-pressed="false">截图</button>
            </div>
            <button class="icon-btn" type="button" id="wire-btn" aria-pressed="false" aria-label="线框" title="线框">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 1.8 13.5 5v6L8 14.2 2.5 11V5L8 1.8Zm0 0v12.4M2.5 5 8 8.2 13.5 5" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
            </button>
            <button class="icon-btn" type="button" id="fit-btn" aria-label="重置视角" title="重置视角">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 6V2.5H6M13.5 6V2.5H10M2.5 10v3.5H6M13.5 10v3.5H10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div class="vp-readout hidden" id="vp-readout"></div>
          <div class="vp-hint" id="vp-hint">拖动旋转 · 滚轮缩放 · 右键平移</div>
        </div>
      </section>

      <div class="grid-2">
        <section class="section" aria-labelledby="t-checks">
          <div class="section-head"><span class="section-no">02</span><h2 class="section-title" id="t-checks">检查</h2><span class="section-meta" id="checks-meta"></span></div>
          <div id="checks"></div>
        </section>
        <section class="section" aria-labelledby="t-brief">
          <div class="section-head"><span class="section-no">03</span><h2 class="section-title" id="t-brief">需求单</h2><span class="section-meta" id="brief-meta"></span></div>
          <div id="brief"></div>
        </section>
      </div>

      <section class="section" aria-labelledby="t-versions">
        <div class="section-head"><span class="section-no">04</span><h2 class="section-title" id="t-versions">版本</h2><span class="section-meta" id="versions-meta"></span></div>
        <div id="versions"></div>
      </section>
    </main>
  </div>

  <div class="login hidden" id="login" role="dialog" aria-modal="true" aria-labelledby="login-title">
    <form class="login-card" id="login-form">
      <span class="brand-mark" aria-hidden="true"></span>
      <h2 id="login-title">输入访问密码</h2>
      <p class="muted">这个页面连着真实的大模型，需要密码才能使用。</p>
      <label class="sr-only" for="login-password">密码</label>
      <input id="login-password" type="password" autocomplete="current-password" placeholder="访问密码" required>
      <div class="login-error" id="login-error" role="alert"></div>
      <button class="btn btn-primary" type="submit">进入</button>
    </form>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="static/app.js"></script>
</body>
</html>
