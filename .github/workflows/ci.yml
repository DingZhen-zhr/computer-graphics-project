# 持续集成（第二版计划 4 Task 4）：在 Windows 和 Apple 芯片的 Mac 上各跑一遍
#   全部测试 → 用检出的源码跑安装脚本 → caliper doctor --offline → caliper --smoke → 再装一次（覆盖安装也要成功）
# 不需要任何密钥，不调用任何模型接口。
name: 持续集成

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    env:
      PYTHONUTF8: "1"
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 装 uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: 装 Node（node --test 用）
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 建虚拟环境，装上项目和测试依赖
        shell: bash
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: 跑全部测试（pytest，含真实 SCA 的）
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python; else PY=.venv/bin/python; fi
          "$PY" -m pytest -q

      - name: 用检出的源码跑安装脚本（Windows，PowerShell 5.1）
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CALIPER_SOURCE: ${{ github.workspace }}
        # 按 UTF-8 读进来再执行，和用户的 irm | iex 一样（偏离 D17：5.1 的 -File 会按系统编码读）
        run: powershell -NoProfile -ExecutionPolicy Bypass -Command 'Get-Content -Raw -Encoding UTF8 install.ps1 | Invoke-Expression; exit $LASTEXITCODE'

      - name: 用检出的源码跑安装脚本（Mac）
        if: runner.os == 'macOS'
        shell: bash
        env:
          CALIPER_SOURCE: ${{ github.workspace }}
        run: sh install.sh

      - name: 把 uv 的工具目录加进后面几步的 PATH
        shell: bash
        run: uv tool dir --bin >> "$GITHUB_PATH"

      - name: caliper doctor --offline（返回码必须是 0）
        run: caliper doctor --offline

      - name: caliper --smoke（不开窗口，起服务，请求首页和 /api/boot）
        run: caliper --smoke

      - name: 再跑一次安装脚本，覆盖安装也要成功（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CALIPER_SOURCE: ${{ github.workspace }}
        # 按 UTF-8 读进来再执行，和用户的 irm | iex 一样（偏离 D17：5.1 的 -File 会按系统编码读）
        run: powershell -NoProfile -ExecutionPolicy Bypass -Command 'Get-Content -Raw -Encoding UTF8 install.ps1 | Invoke-Expression; exit $LASTEXITCODE'

      - name: 再跑一次安装脚本，覆盖安装也要成功（Mac）
        if: runner.os == 'macOS'
        shell: bash
        env:
          CALIPER_SOURCE: ${{ github.workspace }}
        run: sh install.sh
