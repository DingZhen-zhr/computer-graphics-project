# 把 site/ 目录（只读演示站，由 python -m cad_agent.web.export demo\phone_stand site 生成）发布到 GitHub Pages。
# 第一次使用前：仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"。
name: 发布演示站

on:
  push:
    branches: [master]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
# 网址：https://dingzhen-zhr.github.io/computer-graphics-project/（Settings → Pages 的 Source 要选 GitHub Actions）
# 页面改了以后：python -m cad_agent.web.export demo\phone_stand site，提交 site/ 就会自动发布
