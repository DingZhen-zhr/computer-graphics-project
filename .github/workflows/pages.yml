# 把 site/ 目录发布到 GitHub Pages：site/index.html 是产品主页（手写），site/demo/ 是在线回放，
# 由 python -m cad_agent.desk.export cad_agent/desk/demo_data/phone_stand site/demo 生成。
# 第一次使用前：仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"。
name: 发布产品主页

on:
  push:
    branches: [master]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
# 网址：https://dingzhen-zhr.github.io/computer-graphics-project/（Settings → Pages 的 Source 要选 GitHub Actions）
# 界面改了以后：python -m cad_agent.desk.export cad_agent/desk/demo_data/phone_stand site/demo，提交 site/ 就会自动发布
